---
- name: Verify Kubernetes cluster connection
  kubernetes.core.k8s_cluster_info:
    kubeconfig: "{{ argocd_kubeconfig }}"
    context: "{{ argocd_context if (argocd_context | d('') | length > 0) else omit }}"
  register: k8s_cluster
  failed_when: false

- name: Fail if cannot connect to Kubernetes cluster
  ansible.builtin.fail:
    msg: >-
      Không thể kết nối tới cụm Kubernetes qua kubeconfig: {{ argocd_kubeconfig }}.
      Vui lòng kiểm tra lại file kubeconfig hoặc biến argocd_kubeconfig!
  when: k8s_cluster is failed or k8s_cluster.version is not defined


- name: Ensure ArgoCD namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ argocd_kubeconfig }}"
    context: "{{ argocd_context if (argocd_context | d('') | length > 0) else omit }}"
    name: "{{ argocd_namespace }}"
    api_version: v1
    kind: Namespace
    state: present
  when: argocd_create_namespace | bool

- name: Setup SOPS + Age integration
  when: argocd_sops_enabled | bool
  block:
    - name: Search for existing Age private key file
      ansible.builtin.set_fact:
        resolved_age_key_file: >-
          {{
            argocd_sops_age_key_file
            if (argocd_sops_age_key_file is file)
            else (lookup('env', 'HOME') ~ '/.config/sops/age/keys.txt')
            if (lookup('env', 'HOME') ~ '/.config/sops/age/keys.txt') is file
            else (lookup('env', 'HOME') ~ '/Library/Application Support/sops/age/keys.txt')
            if (lookup('env', 'HOME') ~ '/Library/Application Support/sops/age/keys.txt') is file
            else ''
          }}

    - name: Fail if Age key file is not found
      ansible.builtin.fail:
        msg: >-
          Không tìm thấy file Age private key tại {{ argocd_sops_age_key_file }}.
          Hãy chạy script 'scripts/init-age-key.sh' trong repo gitops-opennebula để sinh key!
      when: resolved_age_key_file == ''

    - name: Read Age private key content
      ansible.builtin.slurp:
        src: "{{ resolved_age_key_file }}"
      register: age_key_b64
      no_log: true

    - name: Create or update Kubernetes Secret sops-age
      kubernetes.core.k8s:
        kubeconfig: "{{ argocd_kubeconfig }}"
        context: "{{ argocd_context if (argocd_context | d('') | length > 0) else omit }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ argocd_sops_age_secret_name }}"
            namespace: "{{ argocd_namespace }}"
          type: Opaque
          data:
            keys.txt: "{{ age_key_b64.content }}"
      no_log: true

    - name: Create ConfigMap for ArgoCD SOPS CMP Plugin
      kubernetes.core.k8s:
        kubeconfig: "{{ argocd_kubeconfig }}"
        context: "{{ argocd_context if (argocd_context | d('') | length > 0) else omit }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: argocd-cmp-sops
            namespace: "{{ argocd_namespace }}"
          data:
            plugin.yaml: |
              apiVersion: argoproj.io/v1alpha1
              kind: ConfigManagementPlugin
              metadata:
                name: sops
              spec:
                generate:
                  command: ["sh", "-c"]
                  args:
                    - |
                      find . -maxdepth 3 -name "*.enc.yaml" -o -name "*.enc.yml" | while read -r f; do
                        sops -d -i "$f"
                      done
                      if [ -f "kustomization.yaml" ] || [ -f "kustomization.yml" ]; then
                        kustomize build .
                      else
                        cat *.yaml *.yml 2>/dev/null
                      fi

- name: Add Argo Helm Chart Repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: "{{ argocd_helm_chart_repo }}"

- name: Create temporary values file for ArgoCD Helm Release
  ansible.builtin.tempfile:
    state: file
    suffix: .yaml
  register: argocd_values_tmp

- name: Render ArgoCD Helm values template
  ansible.builtin.template:
    src: values.yaml.j2
    dest: "{{ argocd_values_tmp.path }}"
    mode: '0600'

- name: Deploy or Upgrade ArgoCD via Helm
  kubernetes.core.helm:
    kubeconfig: "{{ argocd_kubeconfig }}"
    context: "{{ argocd_context if (argocd_context | d('') | length > 0) else omit }}"
    name: "{{ argocd_helm_release_name }}"
    chart_ref: "argo/{{ argocd_helm_chart_name }}"
    chart_version: "{{ argocd_helm_chart_version }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: false
    values_files:
      - "{{ argocd_values_tmp.path }}"
    wait: true
    timeout: "{{ argocd_helm_timeout }}"

- name: Remove temporary values file
  ansible.builtin.file:
    path: "{{ argocd_values_tmp.path }}"
    state: absent

- name: Wait for ArgoCD Server deployment to be ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ argocd_kubeconfig }}"
    context: "{{ argocd_context if (argocd_context | d('') | length > 0) else omit }}"
    api_version: apps/v1
    kind: Deployment
    label_selectors:
      - "app.kubernetes.io/instance={{ argocd_helm_release_name }}"
      - "app.kubernetes.io/component=server"
    namespace: "{{ argocd_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
  register: argocd_server_deployments
  failed_when: argocd_server_deployments.resources | default([]) | length != 1

- name: Get Kubernetes Node IP for connection info
  kubernetes.core.k8s_info:
    kubeconfig: "{{ argocd_kubeconfig }}"
    context: "{{ argocd_context if (argocd_context | d('') | length > 0) else omit }}"
    api_version: v1
    kind: Node
  register: k8s_nodes

- name: Identify primary Node IP
  ansible.builtin.set_fact:
    primary_node_ip: >-
      {{
        (k8s_nodes.resources[0].status.addresses | selectattr('type', 'equalto', 'InternalIP') | map(attribute='address') | first)
        if (k8s_nodes.resources | length > 0)
        else '127.0.0.1'
      }}

- name: Display ArgoCD Access Information
  ansible.builtin.debug:
    msg:
      - "================================================================"
      - "🎉 ARGOCD GITOPS ĐÃ TRIỂN KHAI THÀNH CÔNG!"
      - "================================================================"
      - "🌐 Web UI (NodePort HTTPS): https://{{ primary_node_ip }}:{{ argocd_server_nodeport_https }}"
      - "🌐 Web UI (NodePort HTTP) : http://{{ primary_node_ip }}:{{ argocd_server_nodeport_http }}"
      - "👤 Username              : admin"
      - "🔑 Lấy mật khẩu khởi tạo trên máy quản trị (không ghi vào log):"
      - "   kubectl --kubeconfig={{ argocd_kubeconfig | quote }}{% if argocd_context | d('') | length > 0 %} --context={{ argocd_context | quote }}{% endif %} -n {{ argocd_namespace }} get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 --decode"
      - "----------------------------------------------------------------"
      - "🚀 Bước tiếp theo: Kích hoạt GitOps Root Application:"
      - "   kubectl apply -f {{ argocd_gitops_repo_path }}/bootstrap/root-application.yaml"
      - "================================================================"
