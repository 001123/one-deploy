---
- name: Deploy ArgoCD GitOps with SOPS and Age
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    # Có thể override đường dẫn kubeconfig khi chạy lệnh:
    # ansible-playbook playbooks/argocd.yml -e "argocd_kubeconfig=/path/to/kubeconfig"
    argocd_kubeconfig: "{{ kubeconfig | default(lookup('env', 'KUBECONFIG') | default('~/.kube/config', true)) }}"
  roles:
    - role: ../roles/argocd
